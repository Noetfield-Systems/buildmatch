name: fieldchange-ci
on:
  push:
    paths:
      - "apps/fieldchange/**"
      - ".github/workflows/fieldchange-ci.yml"
  pull_request:
    paths:
      - "apps/fieldchange/**"
      - ".github/workflows/fieldchange-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/fieldchange
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Compile server and pricing engine
        run: bun run check
      - name: Run deterministic pricing tests and five synthetic operator QA personas
        run: bun test
      - name: Execute bounded Company OS quality feedback loop
        run: bun run qa:loop
      - name: Compile bounded Company OS role contract (production probes run in scheduled QA)
        run: bun build ops/run.ts --target=bun --outfile=/tmp/buildworkflow-ops.js
      - name: Validate bounded issue-publisher syntax (no issues created)
        run: bun build qa/publish.ts --target=bun --outfile=/tmp/fieldchange-qa-publish.js
      - name: Preserve structured quality feedback / WorkPacket candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fieldchange-five-persona-qa-${{ github.run_id }}
          path: apps/fieldchange/qa-out/latest.json
          if-no-files-found: warn
          retention-days: 30
