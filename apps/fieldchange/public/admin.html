<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FieldChange Desk Admin</title><style>body{margin:0;background:#f4f6f8;color:#172536;font:14px system-ui}.wrap{max-width:1100px;margin:40px auto;padding:0 18px}.card{background:#fff;border:1px solid #dfe5eb;border-radius:12px;padding:20px;margin-bottom:14px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input{padding:10px;border:1px solid #d9e0e7;border-radius:7px;min-width:250px}button{padding:10px 13px;border:0;border-radius:7px;background:#102338;color:#fff;font-weight:700;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #e5eaf0;font-size:11px;vertical-align:top}th{color:#66778a;text-transform:uppercase;font-size:9px}.scroll{overflow:auto}.count{font-size:28px;font-weight:800;color:#176a50}</style></head><body><main class="wrap"><div class="card"><h1>FieldChange Desk · Private pilot intake</h1><small>Lead access is protected by the server admin token.</small></div><div class="card"><div class="row"><input id="token" type="password" placeholder="Admin token" autocomplete="current-password"><button id="load">Load requests</button><button id="csv">Export CSV</button><button id="clear">Clear session</button></div><p id="message"></p></div><div class="card"><small>Captured requests</small><div class="count" id="count">—</div></div><div class="card scroll"><table><thead><tr><th>Received</th><th>Company / contact</th><th>Trade</th><th>Email / phone</th><th>Volume / process</th><th>Problem</th><th></th></tr></thead><tbody id="leads"><tr><td colspan="7">Authenticate to load.</td></tr></tbody></table></div></main><script>
const el=id=>document.getElementById(id);let token=sessionStorage.getItem("fieldchange-token")||"";el("token").value=token;const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function load(){token=el("token").value.trim();const r=await fetch("/api/admin/leads",{headers:{Authorization:"Bearer "+token}});const d=await r.json();if(!r.ok){el("message").textContent=d.error||"Access denied.";return;}sessionStorage.setItem("fieldchange-token",token);el("message").textContent="Loaded "+d.count+" requests.";el("count").textContent=d.count;el("leads").innerHTML=d.leads.map(x=>"<tr><td>"+esc(new Date(x.created_at).toLocaleString())+"</td><td><b>"+esc(x.company)+"</b><br>"+esc(x.contact_name)+"</td><td>"+esc(x.trade)+"</td><td>"+esc(x.email)+"<br>"+esc(x.phone)+"</td><td>"+esc(x.monthly_volume)+"<br>"+esc(x.current_process)+"</td><td>"+esc(x.problem)+"</td><td><button data-id='"+esc(x.id)+"'>Delete</button></td></tr>").join("")||"<tr><td colspan='7'>No requests yet.</td></tr>";}
el("load").addEventListener("click",()=>load().catch(e=>el("message").textContent=e.message));el("clear").addEventListener("click",()=>{sessionStorage.removeItem("fieldchange-token");token="";el("token").value="";el("message").textContent="Session cleared.";});el("csv").addEventListener("click",async()=>{const r=await fetch("/api/admin/export.csv",{headers:{Authorization:"Bearer "+el("token").value.trim()}});if(!r.ok){el("message").textContent="Export failed.";return;}const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="fieldchange-pilot-requests.csv";a.click();URL.revokeObjectURL(u);});el("leads").addEventListener("click",async e=>{const b=e.target.closest("[data-id]");if(!b||!confirm("Delete this lead?"))return;const r=await fetch("/api/admin/leads/"+b.dataset.id,{method:"DELETE",headers:{Authorization:"Bearer "+el("token").value.trim()}});if(r.ok)load();});</script></body></html>
